name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: bash scripts/dev.sh install
        env: { PYTHON: python }
      - run: bash scripts/dev.sh test
        env: { PYTHON: python }
      - run: bash scripts/dev.sh example
        env: { PYTHON: python }
